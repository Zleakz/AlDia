<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlDía | Cargar resumen PDF</title>
</head>
<body>
    <h1>Cargar resumen desde PDF</h1>

    <p>Seleccioná el resumen de tu tarjeta para extraer los datos automáticamente.</p>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Extraer datos del PDF</button>
    </form>

    <p><a href="{% url 'registrar_resumen' %}">Registrar manualmente</a></p>
    <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>
</body>
</html>
