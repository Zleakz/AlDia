
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlDía | Registrar resumen</title>
</head>
<body>

    <h1>Registrar resumen</h1>

    {% if datos_extraidos %}
        <p>
            Los datos se extrajeron correctamente del PDF.
            Revisalos y completá el nombre de la tarjeta antes de guardar.
        </p>
    {% endif %}

    <form method="post" action="{% url 'registrar_resumen' %}">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Guardar resumen</button>
    </form>

    <p>
        <a href="{% url 'inicio' %}">Volver al inicio</a>
    </p>

</body>
</html>
